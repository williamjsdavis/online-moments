[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "online_moments"
version = "0.1.0"
description = "Streaming estimation of conditional moments and Kramers-Moyal coefficients of stochastic processes"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "William Davis"}]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "numba>=0.59",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "matplotlib>=3.7",
    "h5py>=3.10",
    "pdf2image>=1.17",
]

[tool.hatch.build.targets.wheel]
packages = ["src/online_moments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
