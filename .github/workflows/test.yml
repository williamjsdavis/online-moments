name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        numpy-version: ["1.26", "2.1"]

    name: "py${{ matrix.python-version }} / numpy ${{ matrix.numpy-version }}"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and pinned NumPy
        run: |
          pip install -e ".[dev]"
          pip install "numpy==${{ matrix.numpy-version }}.*"

      - name: Show resolved versions
        run: pip show numpy numba | grep -E "^(Name|Version)"

      - name: Run pytest
        run: pytest tests/ -v
